name: CI Validation

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend-contract-and-smoke:
    name: Backend Contract and Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile backend modules
        run: |
          python -m py_compile backend/app.py backend/models.py backend/routes/*.py

      - name: API contract check
        run: |
          BACKEND_URL="${{ vars.PROD_BACKEND_URL }}"
          BACKEND_URL="${BACKEND_URL:-https://gamified-learning.onrender.com}"
          python scripts/check_api_contract.py --workspace . --backend "$BACKEND_URL" --timeout 30

      - name: Core smoke check
        run: |
          FRONTEND_URL="${{ vars.PROD_FRONTEND_URL }}"
          BACKEND_URL="${{ vars.PROD_BACKEND_URL }}"
          FRONTEND_URL="${FRONTEND_URL:-https://gamified-learning-flame.vercel.app}"
          BACKEND_URL="${BACKEND_URL:-https://gamified-learning.onrender.com}"
          python scripts/smoke_test_core_flows.py --frontend "$FRONTEND_URL" --backend "$BACKEND_URL" --skip-register --timeout 45
